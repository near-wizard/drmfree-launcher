name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      # macOS dropped for now: a clippy lint fails there (macos-latest,
      # 2026-09-03) that isn't reproducible on Windows/Linux locally
      # (no Mac available to test against, and cross-compiling clippy
      # checks for macOS from Windows fails earlier on missing `cc`).
      # Revisit with real macOS CI access to diagnose properly instead
      # of guessing at the fix blind.
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck + build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
